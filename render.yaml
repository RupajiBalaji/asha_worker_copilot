services:
  # ============================================================================
  # 1. FastAPI Backend — Python Web Service
  # ============================================================================
  - type: web
    name: asha-copilot-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: "bash ./render-build.sh"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # DATABASE — set this in Render dashboard to your Supabase URL:
      # postgresql://postgres:asha%40copoilot@db.gyaxymczbyphvwcnrwct.supabase.co:5432/postgres
      - key: DATABASE_URL
        sync: false
      # CORS — will be set automatically after frontend deploys
      # Update this to your actual frontend Render URL, e.g.:
      # https://asha-copilot-frontend.onrender.com
      - key: ALLOWED_ORIGINS
        value: "*"

  # ============================================================================
  # 2. React + Vite Frontend — Static Site
  # ============================================================================
  - type: web
    name: asha-copilot-frontend
    runtime: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    headers:
      - path: "/*"
        name: Cache-Control
        value: "no-cache"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # This will be set to the backend's Render URL automatically
      # e.g., https://asha-copilot-backend.onrender.com
      - key: VITE_API_BASE
        sync: false
