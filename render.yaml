services:
  # ============================================================================
  # 1. FastAPI Backend Web Service
  # ============================================================================
  - type: web
    name: asha-copilot-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: "bash ./render-build.sh"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEYS
        sync: false

  # ============================================================================
  # 2. React + Vite Frontend Static Site
  # ============================================================================
  - type: web
    name: asha-copilot-frontend
    runtime: static
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        fromService:
          type: web
          name: asha-copilot-backend
          property: host
