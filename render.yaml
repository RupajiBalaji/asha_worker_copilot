services:
  # ============================================================================
  # 1. FastAPI Backend - Python Web Service
  # ============================================================================
  - type: web
    name: asha-copilot-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: "bash ./render-build.sh"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # DATABASE_URL is automatically injected from the Render PostgreSQL database below
      - key: DATABASE_URL
        fromDatabase:
          name: asha-copilot-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: "*"

  # ============================================================================
  # 2. React + Vite Frontend - Static Site
  # ============================================================================
  - type: web
    name: asha-copilot-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    headers:
      - path: "/*"
        name: Cache-Control
        value: "no-cache"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        sync: false

# ============================================================================
# 3. Render PostgreSQL Database (free, same network as backend)
# ============================================================================
databases:
  - name: asha-copilot-db
    plan: free
    region: oregon
    databaseName: asha_copilot
    user: asha_user
